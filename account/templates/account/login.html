{% extends "base.html" %}
{% load static %}

{% block css_files %}
    <style>
        body {
            background: radial-gradient(circle at top left, rgba(102, 16, 242, .14), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(13, 110, 253, .18), transparent 28%),
                        #0f172a;
            color: #f8f9fa;
        }
        .auth-page {
            min-height: calc(100vh - 80px);
        }
        .auth-card {
            width: min(100%, 460px);
            background: rgba(15, 23, 42, .95);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 28px 80px rgba(15,23,42,.32);
        }
        .auth-card-header {
            background: linear-gradient(135deg, #0d6efd 0%, #6f42c1 100%);
        }
        .auth-card-header h2 {
            margin-bottom: .25rem;
            font-weight: 800;
        }
        .auth-card-label {
            color: #e2e8f0;
            font-size: .9rem;
            margin-bottom: .45rem;
        }
        .auth-card .form-control {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            color: #f8f9fa;
        }
        .auth-card .form-control:focus {
            border-color: rgba(13,110,253,.75);
            box-shadow: 0 0 0 .2rem rgba(13,110,253,.15);
        }
        .auth-card .form-check-label {
            color: #ced4da;
        }
        .auth-card .form-text {
            color: rgba(226, 232, 240, .8);
        }
        .auth-card .btn-primary {
            background: #0d6efd;
            border-color: #0d6efd;
        }
        .auth-card .btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
        .auth-footer {
            font-size: .95rem;
            color: rgba(226,232,240,.75);
        }
        .auth-footer a {
            color: #f8f9fa;
            text-decoration: underline;
        }
        .auth-footer a:hover {
            color: #c7d2fe;
        }
    </style>
{% endblock %}

{% block title %}
    Login
{% endblock %}

{% block content %}
    <div class="container auth-page d-flex align-items-center justify-content-center py-5">
        <div class="auth-card rounded-4 overflow-hidden">
            <div class="auth-card-header text-center px-5 py-4">
                <h2>Welcome Back</h2>
                <p class="mb-0 text-white-50">Login to access your game list.</p>
            </div>
            <div class="p-4">
                <form action="{% url 'login' %}" method="POST" novalidate>
                    {% csrf_token %}
                    {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                    {% endif %}
                    <div class="mb-4">
                        <label class="form-label auth-card-label" for="username">Kullanıcı adı</label>
                        <input id="username" name="username" type="text" class="form-control" placeholder="Enter your username" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label auth-card-label" for="password">Şifre</label>
                        <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                    <p class="auth-footer text-center mb-0">
                        Hesabın yok mu? <a href="{% url 'register' %}">Kayıt ol</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
